name: Power Platform ALM & Solution Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify-solution:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack Solution (Build Solution Package)
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-file: 'ContosoITConciergeAgent.zip'
          solution-folder: 'src'
          solution-type: 'Unmanaged'

      - name: Upload Solution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-solution
          path: ContosoITConciergeAgent.zip
