name: Power Platform ALM & Solution Packaging

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify-solution:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Create Artifacts Directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist

      - name: Pack Solution via pac CLI
        shell: pwsh
        run: pac solution pack --zipfile dist/ContosoITConciergeAgent.zip --folder src

      - name: Upload Solution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-solution
          path: dist/ContosoITConciergeAgent.zip
